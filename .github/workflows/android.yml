name: APK Android

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK de Android
        uses: android-actions/setup-android@v3

      - name: Compilar APK de depuracion
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar que el juego quedo dentro del APK
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E "assets/(index\\.html|vendor/three\\.min\\.js|js/game\\.js)" \
            || { echo "Faltan archivos del juego dentro del APK"; exit 1; }
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: gran-premio-3d-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar release descargable
        if: github.ref == 'refs/heads/claude/formula-uno-3d-game-4z2xuv'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Gran Premio 3D (APK)
          body: APK de depuracion generado automaticamente desde la ultima version del juego.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
