<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Showroom</title>
<style>html,body{margin:0;height:100%;background:#1b2330;overflow:hidden}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script src="vendor/three.min.js"></script>
<script src="js/textures.js"></script>
<script src="js/car.js"></script>
<script>
var r = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias:true});
r.setSize(innerWidth, innerHeight); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
if ('outputColorSpace' in r) r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.98;
var sc = new THREE.Scene(); sc.background = new THREE.Color(0x9fc3e0);
var cam = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
sc.add(new THREE.HemisphereLight(0xc6ddf2, 0x4a6b34, 0.45));
var sun = new THREE.DirectionalLight(0xfff3e0, 1.2); sun.position.set(-6, 9, 6); sun.castShadow = true;
sun.shadow.camera.left=-8;sun.shadow.camera.right=8;sun.shadow.camera.top=8;sun.shadow.camera.bottom=-8;
sun.shadow.mapSize.set(2048,2048); sun.shadow.normalBias=0.03; sc.add(sun);
var floor = new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.MeshStandardMaterial({color:0x55606c, roughness:0.9}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; sc.add(floor);
var pm = new THREE.PMREMGenerator(r); sc.environment = pm.fromEquirectangular(GFX.sky()).texture;
var car = CarFactory.build(Object.assign({}, CarFactory.LIVERIES.alpine, {blobShadow:false}));
sc.add(car.root);
window.setView = function(which){
  var p = {rear:[0,2.2,-8], front:[0,1.8,8.5], side:[8,2.0,0.5], top:[3.2,5.2,5.2], cockpit:[1.4,1.5,3.2]}[which];
  cam.position.set(p[0],p[1],p[2]); cam.lookAt(0,0.6,0); r.render(sc,cam);
};
setView('rear');
</script></body></html>
